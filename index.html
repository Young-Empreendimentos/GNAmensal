<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young Empreendimentos - Dashboard Financeiro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%230D0D0D' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='50' font-weight='bold' fill='%23FE5009' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #FE5009;
            --primary-dark: #751900;
            --primary-light: #ff6b2c;
            --accent: #FE5009;
            --accent-light: #ff7a3d;
            --black: #0D0D0D;
            --dark-gray: #323232;
            --light-gray: #D7D7D9;
            --success: #2e7d32;
            --warning: #f59e0b;
            --danger: #dc2626;
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-300: #d4d4d4;
            --gray-400: #a3a3a3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-800: #262626;
            --gray-900: #171717;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #f5f5f5 0%, var(--light-gray) 100%);
            color: var(--dark-gray);
            min-height: 100vh;
            line-height: 1.6;
        }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader-logo {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .loader-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text {
            color: rgba(255,255,255,0.9);
            font-size: 0.95rem;
            font-weight: 400;
            margin-top: 20px;
        }

        .page-wrapper {
            display: none;
            flex-direction: column;
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            border-radius: 20px;
            padding: 28px 36px;
            box-shadow: var(--shadow-xl);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(254,80,9,0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            z-index: 1;
        }
        .header-logo {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .header-logo-text {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -1px;
            line-height: 1;
        }
        .header-logo-tagline {
            font-size: 0.65rem;
            color: var(--light-gray);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
            margin-top: 4px;
        }
        .header-divider {
            width: 2px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            margin: 0 8px;
        }
        .header-info h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.3px;
        }
        .header-info p {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            margin-top: 2px;
            font-weight: 400;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            z-index: 1;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--accent);
            color: var(--gray-900);
        }
        .btn-primary:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 162, 39, 0.4);
        }
        .btn-outline {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-1px);
        }
        .data-badge {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .filters-bar {
            background: white;
            border-radius: 14px;
            padding: 18px 26px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: center;
            border: 1px solid var(--gray-100);
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray-600);
        }
        input[type="date"] {
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--gray-700);
            background: var(--gray-50);
            transition: all 0.2s;
        }
        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(254, 80, 9, 0.15);
            background: white;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .checkbox-wrapper span {
            font-size: 0.85rem;
            color: var(--gray-600);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }
        .summary-card {
            background: white;
            border-radius: 14px;
            padding: 22px 26px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid var(--gray-100);
        }
        .summary-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
        }
        .summary-card.danger::before { background: var(--danger); }
        .summary-card.warning::before { background: var(--warning); }
        .summary-card.success::before { background: var(--success); }
        .summary-card-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
        }
        .summary-card-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .summary-card.danger .summary-card-value { color: var(--danger); }
        .summary-card.highlight {
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%);
            border: 2px solid var(--primary);
        }
        .summary-card.highlight::before { 
            display: block;
            background: var(--primary);
            width: 6px;
        }
        .summary-card.highlight .summary-card-label { color: var(--light-gray); }
        .summary-card.highlight .summary-card-value { color: var(--primary); }

        .tabs-container {
            background: white;
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--gray-100);
        }
        .tabs-nav {
            display: flex;
            gap: 6px;
            padding: 10px;
            background: var(--gray-50);
            overflow-x: auto;
            border-bottom: 1px solid var(--gray-200);
        }
        .tab-btn {
            padding: 12px 22px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray-500);
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        .tab-btn:hover { background: white; color: var(--dark-gray); }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: var(--shadow);
            font-weight: 600;
        }
        .tabs-content {
            padding: 28px;
            min-height: 420px;
        }
        .tab-pane { display: none; animation: fadeIn 0.35s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--gray-200);
        }
        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--gray-800);
        }
        .section-total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--black);
        }
        .section-total.danger { color: var(--primary-dark); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th {
            text-align: left;
            padding: 14px 18px;
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 2px solid var(--gray-200);
            position: sticky;
            top: 0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-700);
        }
        tr:hover { background: var(--gray-50); }
        tr.total-row {
            background: linear-gradient(90deg, var(--gray-100) 0%, var(--gray-50) 100%);
            font-weight: 600;
        }
        tr.total-row td { color: var(--gray-900); }

        .multiselect-container { margin-bottom: 22px; position: relative; }
        .multiselect-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 300px;
            padding: 11px 16px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--gray-700);
            transition: all 0.2s;
            font-family: inherit;
        }
        .multiselect-btn:hover { border-color: var(--primary); background: var(--gray-50); }
        .multiselect-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 340px;
            max-height: 320px;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 10px;
            box-shadow: var(--shadow-xl);
            z-index: 100;
            margin-top: 6px;
        }
        .multiselect-dropdown.show { display: block; }
        .multiselect-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .multiselect-option:hover { background: var(--gray-50); }
        .multiselect-option.header {
            border-bottom: 1px solid var(--gray-200);
            font-weight: 600;
            background: var(--gray-50);
            color: var(--dark-gray);
        }

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: var(--gray-500);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: var(--gray-500);
            font-size: 0.75rem;
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .footer a:hover { 
            text-decoration: underline; 
            color: var(--primary-dark);
        }

        @media (max-width: 768px) {
            .page-wrapper { padding: 16px; gap: 16px; }
            .header { padding: 20px; flex-direction: column; align-items: flex-start; border-radius: 16px; }
            .header-divider { display: none; }
            .header-title { flex-direction: column; align-items: flex-start; gap: 12px; }
            .filters-bar { flex-direction: column; align-items: stretch; }
            .multiselect-btn, .multiselect-dropdown { width: 100%; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-logo">Young</div>
        <div class="loader-subtitle">Empreendimentos</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">Carregando dashboard financeiro...</div>
    </div>

    <div class="page-wrapper">
        
        <header class="header">
            <div class="header-title">
                <div class="header-logo">
                    <span class="header-logo-text">Young</span>
                    <span class="header-logo-tagline">Empreendimentos</span>
                </div>
                <div class="header-divider"></div>
                <div class="header-info">
                    <h1>Dashboard Financeiro</h1>
                    <p>Análise de Despesas por Centro de Custo</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="data-badge" id="data-badge">
                    <span id="records-count">0</span> registros
                </div>
                <button class="btn btn-outline" onclick="loadData()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    Atualizar
                </button>
            </div>
        </header>

        <div class="filters-bar">
            <div class="filter-group">
                <label>De:</label>
                <input type="date" id="start-date">
            </div>
            <div class="filter-group">
                <label>Até:</label>
                <input type="date" id="end-date">
            </div>
            <label class="checkbox-wrapper" style="margin-left: auto;">
                <input type="checkbox" id="check-prolabore">
                <span>Incluir Pró-labore nos Operacionais</span>
            </label>
        </div>

        <div class="summary-grid" id="summary-panel"></div>

        <div class="tabs-container">
            <nav class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('cc1000')">CC 1000</button>
                <button class="tab-btn" onclick="switchTab('cc2000')">CC 2000</button>
                <button class="tab-btn" onclick="switchTab('cc2002')">CC 2002</button>
                <button class="tab-btn" onclick="switchTab('total')">Total Geral</button>
                <button class="tab-btn" onclick="switchTab('chart')">Gráfico Operacional</button>
                <button class="tab-btn" onclick="switchTab('excluded')">Todos Excluídos</button>
                <button class="tab-btn" onclick="switchTab('excluded-chart')">Gráfico Excluídos</button>
            </nav>
            <div class="tabs-content">
                <div id="cc1000" class="tab-pane active"></div>
                <div id="cc2000" class="tab-pane"></div>
                <div id="cc2002" class="tab-pane"></div>
                <div id="total" class="tab-pane"></div>
                <div id="chart" class="tab-pane"></div>
                <div id="excluded" class="tab-pane"></div>
                <div id="excluded-chart" class="tab-pane"></div>
            </div>
        </div>

    </div>

<script>
    const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkiy-n--R8fAEJJQD2Axayu6LbLSOfYLZsJxQ49xDp560RUzUtH1CeivSvAO71fmE_6sbSAfHvud2Z/pub?gid=1605452357&single=true&output=csv';

    const EXCLUSION_RULES = {
        exact: [
            'pis, cofins e csll (sobre faturamento/receita)', 
            'repasses de gestao de carteira de permuta fisica', 
            'cofins (sobre faturamento/receita)', 
            'pis (sobre faturamento/receita)',
            'distribuicao de dividendos', 
            'recolhimento de pis, cofins e csll',
            'recolhimento de pis cofins e csll',
            'recolhimento retencao ir',
            'pis cofins e csll (sobre faturamento/receita)'
        ],
        contains: ['pro-labore', 'pro labore', 'pró-labore', 'pró labore', 'dividendos']
    };

    const BLACKLIST_TERMS = ['saldo anterior', 'saldo final', 'total geral', 'total do periodo', 'resumo financeiro', 'subtotal', 'transportado', 'a transportar'];

    let STATE = {
        rawData: [],           
        operationalData: [],   
        excludedData: [],      
        currentTab: 'cc1000',
        filters: { start: null, end: null, includeProLabore: false }
    };

    function normalizeText(text) {
        if (!text) return '';
        return text.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function parseCurrency(value) {
        if (typeof value === 'number') return value;
        if (!value) return 0;
        let str = String(value).trim().replace(/[R$]/gi, '').trim();
        let sign = 1;
        if (str.includes('(') && str.includes(')')) { sign = -1; str = str.replace(/[()]/g, ''); }
        else if (str.startsWith('-')) { sign = -1; }
        const lastCommaIndex = str.lastIndexOf(',');
        const lastDotIndex = str.lastIndexOf('.');
        if (lastCommaIndex > lastDotIndex) { str = str.replace(/\./g, '').replace(',', '.'); }
        else { str = str.replace(/,/g, ''); }
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num * sign;
    }

    function formatCurrency(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function parseDate(dateStr) {
        if (!dateStr) return null;
        dateStr = dateStr.trim();
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        if (dateStr.includes('-')) {
            const parts = dateStr.split('-');
            if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
        }
        return null;
    }

    function loadData() {
        document.getElementById('loader').style.display = 'flex';
        fetch(SHEETS_URL + '&t=' + Date.now())
            .then(response => response.text())
            .then(csvText => processCSV(csvText))
            .catch(error => {
                document.getElementById('loader').style.display = 'none';
                alert('Erro ao carregar dados: ' + error.message);
            });
    }

    function processCSV(csvText) {
        const rawData = d3.csvParse(csvText, (d) => {
            const keys = Object.keys(d);
            const normalized = {};
            keys.forEach(k => normalized[k.trim().toLowerCase()] = d[k]);
            
            const valor = parseCurrency(normalized['valor']);
            if (valor === 0) return null;

            const plano = (normalized['plano financeiro'] || normalized['plano'] || '').trim();
            const credor = (normalized['credor'] || '').trim();
            const cc = (normalized['centro de custo'] || normalized['centro custo'] || '').trim();

            const planoNorm = normalizeText(plano);
            const credorNorm = normalizeText(credor);
            
            if (BLACKLIST_TERMS.some(term => planoNorm.includes(term) || credorNorm.includes(term))) return null;
            if (planoNorm === 'total' || planoNorm.startsWith('total ')) return null;

            return {
                dataOriginal: normalized['data'],
                dataObj: parseDate(normalized['data']),
                plano: plano,
                cc: cc,
                credor: credor,
                valor: valor,
                origem: 'csv'
            };
        });

        STATE.rawData = rawData.filter(d => d !== null && ['1000', '2000', '2002'].includes(d.cc));
        
        classifyData();
        setupInitialFilters();
        setupEventListeners();
        updateDashboard();
        updateDataInfo();
        
        document.getElementById('loader').style.display = 'none';
        document.querySelector('.page-wrapper').style.display = 'flex';
    }

    function updateDataInfo() {
        document.getElementById('records-count').textContent = STATE.rawData.length;
    }

    function classifyData() {
        STATE.operationalData = [];
        STATE.excludedData = [];

        STATE.rawData.forEach(item => {
            const planoNormalized = normalizeText(item.plano);
            let isExcluded = false;

            if (EXCLUSION_RULES.exact.some(term => planoNormalized.includes(term))) isExcluded = true;
            
            if (!isExcluded) {
                for (const term of EXCLUSION_RULES.contains) {
                    if (planoNormalized.includes(normalizeText(term))) {
                        isExcluded = true;
                        break;
                    }
                }
            }

            if (isExcluded) STATE.excludedData.push(item);
            else STATE.operationalData.push(item);
        });
    }

    function getFilteredData(type) {
        let baseData = (type === 'excluded') ? [...STATE.excludedData] : [...STATE.operationalData];
        
        if (STATE.filters.start && STATE.filters.end) {
            baseData = baseData.filter(d => d.dataObj && d.dataObj >= STATE.filters.start && d.dataObj <= STATE.filters.end);
        }

        if (type === 'operational' && STATE.filters.includeProLabore) {
            const proLaboreData = STATE.excludedData.filter(d => {
                const planoNorm = normalizeText(d.plano);
                return planoNorm.includes('pro-labore') || planoNorm.includes('pro labore') || 
                       planoNorm.includes('pró-labore') || planoNorm.includes('pró labore');
            }).filter(d => {
                if (!STATE.filters.start || !STATE.filters.end) return true;
                return d.dataObj && d.dataObj >= STATE.filters.start && d.dataObj <= STATE.filters.end;
            });
            baseData = [...baseData, ...proLaboreData];
        }

        return baseData;
    }

    function updateDashboard() {
        const startVal = document.getElementById('start-date').value;
        const endVal = document.getElementById('end-date').value;
        STATE.filters.start = startVal ? new Date(startVal + 'T00:00:00') : null;
        STATE.filters.end = endVal ? new Date(endVal + 'T23:59:59') : null;
        STATE.filters.includeProLabore = document.getElementById('check-prolabore').checked;

        const opData = getFilteredData('operational');
        const exData = getFilteredData('excluded');

        renderSummaryCards(opData, exData);
        renderCurrentTab(opData, exData);
    }

    function renderSummaryCards(opData, exData) {
        const sumOp = (cc) => d3.sum(opData.filter(d => cc === 'total' || d.cc === cc), d => d.valor);
        const sumEx = (cc) => d3.sum(exData.filter(d => cc === 'total' || d.cc === cc), d => d.valor);
        
        const html = `
            <div class="summary-card"><div class="summary-card-label">CC 1000 - Operacional</div><div class="summary-card-value">${formatCurrency(sumOp('1000'))}</div></div>
            <div class="summary-card"><div class="summary-card-label">CC 2000 - Operacional</div><div class="summary-card-value">${formatCurrency(sumOp('2000'))}</div></div>
            <div class="summary-card"><div class="summary-card-label">CC 2002 - Operacional</div><div class="summary-card-value">${formatCurrency(sumOp('2002'))}</div></div>
            <div class="summary-card highlight"><div class="summary-card-label">Total Operacional</div><div class="summary-card-value">${formatCurrency(sumOp('total'))}</div></div>
            
            <div class="summary-card danger"><div class="summary-card-label">CC 1000 - Excluídos</div><div class="summary-card-value">${formatCurrency(sumEx('1000'))}</div></div>
            <div class="summary-card danger"><div class="summary-card-label">CC 2000 - Excluídos</div><div class="summary-card-value">${formatCurrency(sumEx('2000'))}</div></div>
            <div class="summary-card danger"><div class="summary-card-label">CC 2002 - Excluídos</div><div class="summary-card-value">${formatCurrency(sumEx('2002'))}</div></div>
            <div class="summary-card danger"><div class="summary-card-label">Total Excluídos</div><div class="summary-card-value">${formatCurrency(sumEx('total'))}</div></div>
        `;
        document.getElementById('summary-panel').innerHTML = html;
    }

    function renderCurrentTab(opData, exData) {
        const target = document.getElementById(STATE.currentTab);
        target.innerHTML = ''; 

        if (STATE.currentTab === 'chart') { renderChart(opData, 'operational', target); return; }
        if (STATE.currentTab === 'excluded-chart') { renderChart(exData, 'excluded', target); return; }

        if (STATE.currentTab.startsWith('cc')) {
            const ccFilter = STATE.currentTab.replace('cc', '');
            const filteredOp = opData.filter(d => d.cc === ccFilter);
            const filteredEx = exData.filter(d => d.cc === ccFilter);

            renderSection(target, `Despesas Operacionais - CC ${ccFilter}`, filteredOp, `op-${ccFilter}`, false);
            if (filteredEx.length > 0) {
                renderSection(target, `Itens Excluídos - CC ${ccFilter}`, filteredEx, `ex-${ccFilter}`, true);
            }
            return;
        }

        if (STATE.currentTab === 'total') { renderSection(target, 'Resumo Geral Operacional', opData, 'total-op', false); return; }
        if (STATE.currentTab === 'excluded') { renderSection(target, 'Todos os Itens Excluídos', exData, 'total-ex', true); return; }
    }

    function renderSection(container, title, data, contextId, isDanger) {
        const total = d3.sum(data, d => d.valor);
        const wrapper = document.createElement('div');
        wrapper.style.marginBottom = '40px';
        
        wrapper.innerHTML = `
            <div class="section-header">
                <div class="section-title">${title}</div>
                <div class="section-total ${isDanger ? 'danger' : ''}">${formatCurrency(total)}</div>
            </div>
        `;
        
        renderTableWithFilters(wrapper, data, contextId);
        container.appendChild(wrapper);
    }

    function renderTableWithFilters(container, data, contextId) {
        const plans = Array.from(new Set(data.map(d => d.plano))).sort();
        
        if (data.length === 0) {
            container.innerHTML += '<div class="empty-state"><p>Sem dados para exibir.</p></div>';
            return;
        }

        const filterDiv = document.createElement('div');
        filterDiv.className = 'multiselect-container';
        filterDiv.innerHTML = `
            <button class="multiselect-btn" onclick="toggleDropdown('${contextId}')">
                <span>Filtrar Planos (${plans.length})</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div id="dropdown-${contextId}" class="multiselect-dropdown">
                <label class="multiselect-option header">
                    <input type="checkbox" checked onchange="toggleAllOptions(this, '${contextId}')"> Selecionar Todos
                </label>
                ${plans.map(p => `
                    <label class="multiselect-option">
                        <input type="checkbox" value="${p}" checked class="opt-${contextId}" onchange="refreshTable('${contextId}')"> ${p}
                    </label>
                `).join('')}
            </div>
        `;
        container.appendChild(filterDiv);

        const tableDiv = document.createElement('div');
        tableDiv.id = `table-wrapper-${contextId}`;
        container.appendChild(tableDiv);

        drawTable(tableDiv, data);
        container.dataset.jsonData = JSON.stringify(data);
    }

    window.refreshTable = function(contextId) {
        const dropdown = document.getElementById(`dropdown-${contextId}`);
        const wrapper = dropdown.closest('.multiselect-container').parentElement; 
        const data = JSON.parse(wrapper.dataset.jsonData || '[]');
        const checkboxes = document.querySelectorAll(`.opt-${contextId}:checked`);
        const selectedPlans = Array.from(checkboxes).map(cb => cb.value);
        const filtered = data.filter(d => selectedPlans.includes(d.plano));
        const tableDiv = document.getElementById(`table-wrapper-${contextId}`);
        const total = d3.sum(filtered, d => d.valor);
        const headerTotal = wrapper.querySelector('.section-total');
        if(headerTotal) headerTotal.textContent = formatCurrency(total);
        drawTable(tableDiv, filtered);
    };

    function drawTable(container, data) {
        const grouped = d3.rollups(data, v => d3.sum(v, d => d.valor), d => d.plano).sort((a, b) => b[1] - a[1]);
        const total = d3.sum(grouped, d => d[1]);

        let html = `<table><thead><tr><th>Plano Financeiro</th><th style="text-align:right">Valor Total</th><th style="text-align:right">%</th></tr></thead><tbody>`;

        if (grouped.length === 0) {
            html += '<tr><td colspan="3" style="text-align:center;color:var(--gray-500)">Nenhum item selecionado.</td></tr>';
        } else {
            grouped.forEach(([plano, valor]) => {
                const pct = total !== 0 ? ((valor/total)*100).toFixed(1) : 0;
                html += `<tr><td>${plano}</td><td style="text-align:right">${formatCurrency(valor)}</td><td style="text-align:right">${pct}%</td></tr>`;
            });
            html += `<tr class="total-row"><td>TOTAL</td><td style="text-align:right">${formatCurrency(total)}</td><td style="text-align:right">100%</td></tr>`;
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function renderChart(data, type, container) {
        const grouped = d3.rollups(data, v => d3.sum(v, d => d.valor), d => d.plano).sort((a, b) => b[1] - a[1]);
        const x = grouped.map(d => d[0]);
        const y = grouped.map(d => d[1]);
        const color = type === 'operational' ? '#FE5009' : '#751900';
        const shortX = x.map(lbl => lbl.length > 25 ? lbl.substring(0, 25) + '...' : lbl);

        const trace = {
            x: shortX, y: y, type: 'bar',
            text: y.map(val => formatCurrency(val)),
            textposition: 'auto',
            marker: { color: color, cornerradius: 4 },
            hoverinfo: 'x+text',
            hovertext: x.map((n, i) => `${n}<br>${formatCurrency(y[i])}`)
        };

        const layout = {
            title: { text: type === 'operational' ? 'Despesas Operacionais por Plano' : 'Despesas Excluídas por Plano', font: { size: 16, family: 'Inter', color: '#374151' } },
            margin: { b: 150, t: 50 },
            xaxis: { tickangle: -45, tickfont: { size: 11 } },
            yaxis: { tickfont: { size: 11 } },
            height: 500,
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent'
        };

        Plotly.newPlot(container, [trace], layout, {responsive: true});
    }

    function setupInitialFilters() {
        const dates = STATE.rawData.map(d => d.dataObj).filter(d => d);
        if (dates.length > 0) {
            const minDate = new Date(Math.min(...dates));
            const maxDate = new Date(Math.max(...dates));
            document.getElementById('start-date').value = minDate.toISOString().split('T')[0];
            document.getElementById('end-date').value = maxDate.toISOString().split('T')[0];
        }
    }

    function setupEventListeners() {
        document.getElementById('start-date').addEventListener('change', updateDashboard);
        document.getElementById('end-date').addEventListener('change', updateDashboard);
        document.getElementById('check-prolabore').addEventListener('change', updateDashboard);
    }

    window.switchTab = function(tabId) {
        STATE.currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const opData = getFilteredData('operational');
        const exData = getFilteredData('excluded');
        renderCurrentTab(opData, exData);
    };

    window.toggleDropdown = function(id) {
        document.getElementById(`dropdown-${id}`).classList.toggle('show');
    };

    window.toggleAllOptions = function(source, contextId) {
        const checkboxes = document.querySelectorAll(`.opt-${contextId}`);
        checkboxes.forEach(cb => cb.checked = source.checked);
        refreshTable(contextId);
    };

    window.onclick = function(event) {
        if (!event.target.matches('.multiselect-btn') && !event.target.matches('.multiselect-btn *')) {
            document.querySelectorAll('.multiselect-dropdown').forEach(d => {
                if (d.classList.contains('show') && !d.contains(event.target)) d.classList.remove('show');
            });
        }
    }

    loadData();
</script>
